# GitHub Labeler Configuration
# Automatically applies labels to PRs based on changed files

docs:
  - changed-files:
    - '**/*.md'
    - '!scripts/**'
    - '!.github/**'

internal:
  - changed-files:
    - '.github/**'
    - 'scripts/**'
    - '.gitignore'
    - '.pre-commit-config.yaml'

backend:
  - changed-files:
    - 'src/**'
    - 'alembic/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - 'Dockerfile*'
    - 'docker-compose*.yml'

tests:
  - changed-files:
    - 'tests/**'
    - '**/*test*.py'
    - '**/*_test.py'

dependencies:
  - changed-files:
    - 'pyproject.toml'
    - 'uv.lock'
    - 'requirements*.txt'