name: Deploy to Production

on:
  release:
    types:
      - published

jobs:
  deploy:
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - production
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i "s/ENVIRONMENT=local/ENVIRONMENT=production/g" .env
          sed -i "s/DOMAIN=localhost/DOMAIN=api.barrels.gd/g" .env
          sed -i "s/STACK_NAME=barrels-api/STACK_NAME=barrels-api-production/g" .env
          
      - name: Load environment
        run: |
          set -a
          source .env
          set +a
          echo "Using STACK_NAME=$STACK_NAME and DOMAIN=$DOMAIN"
          
      - name: Build with Docker Compose
        run: |
          set -a
          source .env
          set +a
          docker compose --env-file .env -f docker-compose.yml -p $STACK_NAME build
          
      - name: Deploy with Docker Compose
        run: |
          set -a
          source .env
          set +a
          # Start all services except prestart
          docker compose --env-file .env -f docker-compose.yml -p $STACK_NAME up -d --remove-orphans --no-deps db
          # Wait for db to be ready
          echo "Waiting for database to be ready..."
          sleep 10
          # Start prestart service
          echo "Starting prestart service..."
          if ! docker compose --env-file .env -f docker-compose.yml -p $STACK_NAME up --exit-code-from prestart prestart; then
            echo "Prestart service failed. Container logs:"
            docker logs ${STACK_NAME}-prestart-1 || true
            exit 1
          fi
          # Start remaining services
          echo "Starting remaining services..."
          docker compose --env-file .env -f docker-compose.yml -p $STACK_NAME up -d --remove-orphans
          
      - name: Verify services
        run: |
          set -a
          source .env
          set +a
          echo "=== Running containers ==="
          docker ps -a --filter "name=$STACK_NAME" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo -e "\n=== Container logs (last 20 lines) ==="
          for container in $(docker ps -a --filter "name=$STACK_NAME" --format '{{.Names}}'); do
            echo -e "\n=== $container logs ==="
            docker logs --tail 20 $container 2>&1 || true
          done
