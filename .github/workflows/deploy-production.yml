name: Deploy to Production

on:
  release:
    types:
      - published

jobs:
  deploy:
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - production
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i "s/ENVIRONMENT=local/ENVIRONMENT=production/g" .env
          sed -i "s/DOMAIN=localhost/DOMAIN=api.barrels.gd/g" .env
          sed -i "s/STACK_NAME=barrels-api/STACK_NAME=barrels-api-production/g" .env
          
      - name: Load environment
        run: |
          set -a
          source .env
          set +a
          echo "Using STACK_NAME=$STACK_NAME and DOMAIN=$DOMAIN"
          
      - name: Build with Docker Compose
        run: |
          set -a
          source .env
          set +a
          docker compose --env-file .env -f docker-compose.yml -p $STACK_NAME build
          
      - name: Deploy with Docker Compose
        run: |
          set -x  # Enable debug output
          
          # Start database first
          echo "Starting database..."
          docker compose --env-file .env \
                       -f docker-compose.yml \
                       --project-name "$STACK_NAME" \
                       up -d db
          
          # Wait for database to be ready
          echo "Waiting for database to be ready..."
          for i in {1..10}; do
            if docker compose --project-name "$STACK_NAME" ps db --status running | grep -q "healthy"; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database to be ready... ($i/10)"
            sleep 5
            if [ $i -eq 10 ]; then
              echo "::error::Database did not become ready in time"
              docker compose --project-name "$STACK_NAME" logs db
              exit 1
            fi
          done
          
          # Run prestart service and capture its output
          echo "Running prestart service..."
          if ! docker compose --env-file .env \
                            -f docker-compose.yml \
                            --project-name "$STACK_NAME" \
                            up --exit-code-from prestart prestart 2>&1 | tee prestart.log; then
            echo "::error::Prestart service failed with exit code $?"
            echo "=== Prestart container logs ==="
            docker compose --project-name "$STACK_NAME" logs prestart
            echo "=== Prestart command output ==="
            cat prestart.log
            echo "=== Environment variables ==="
            env | sort
            echo "=== Current containers ==="
            docker ps -a
            echo "=== Database logs ==="
            docker compose --project-name "$STACK_NAME" logs db
            exit 1
          fi
          
          # Start remaining services
          echo "Starting all services..."
          docker compose --env-file .env \
                       -f docker-compose.yml \
                       --project-name "$STACK_NAME" \
                       up -d --remove-orphans
          
          # Show service status
          echo "=== Service status ==="
          docker compose --project-name "$STACK_NAME" ps
          
          # Show Traefik logs
          echo "=== Traefik logs (last 20 lines) ==="
          docker compose --project-name "$STACK_NAME" logs --tail=20 traefik 2>&1 || echo "No Traefik logs available"
