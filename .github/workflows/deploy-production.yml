name: Deploy to Production

on:
  release:
    types:
      - published

jobs:
  deploy:
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - production
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i "s/ENVIRONMENT=local/ENVIRONMENT=production/g" .env
          sed -i "s/DOMAIN=localhost/DOMAIN=api.barrels.gd/g" .env
          sed -i "s/STACK_NAME=barrels-api/STACK_NAME=barrels-api-production/g" .env
          
      - name: Build with Docker Compose
        run: docker compose -f docker-compose.yml -p barrels-api-production build
          
      - name: Deploy with Docker Compose
        run: |
          # Start database first
          echo "Starting database..."
          docker compose -f docker-compose.yml -p barrels-api-production up -d db
          
          # Wait for database to be ready
          echo "Waiting for database to be ready..."
          for i in {1..10}; do
            if docker compose -p barrels-api-production ps db --status running | grep -q "healthy"; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database to be ready... ($i/10)"
            sleep 5
            if [ $i -eq 10 ]; then
              echo "::error::Database did not become ready in time"
              docker compose -p barrels-api-production logs db
              exit 1
            fi
          done
          
          # Start remaining services
          echo "Starting all services..."
          docker compose -f docker-compose.yml -p barrels-api-production up -d
          
          # Show service status
          echo "=== Service status ==="
          docker compose -p barrels-api-production ps
          
          # Show logs for debugging
          echo -e "\n=== Prestart logs ==="
          docker compose -p barrels-api-production logs prestart --tail=50 2>&1 || echo "No prestart logs available"
          
          echo -e "\n=== Backend logs ==="
          docker compose -p barrels-api-production logs backend --tail=20 2>&1 || echo "No backend logs available"
          
          echo -e "\n=== Traefik logs ==="
          docker compose -p barrels-api-production logs traefik --tail=20 2>&1 || echo "No Traefik logs available"
