name: Deploy to Staging

on:
  push:
    branches:
      - master

jobs:
  deploy:
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - staging
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup environment
        run: |
          # Preserve existing .env if it exists
          [ -f .env ] || cp .env.example .env
          sed -i "s/^ENVIRONMENT=.*/ENVIRONMENT=staging/" .env
          sed -i "s/^DOMAIN=.*/DOMAIN=staging.api.barrels.gd/" .env
          sed -i "s/^STACK_NAME=.*/STACK_NAME=barrels-api-staging/" .env
          # Frontend public origin for emails and links
          if grep -q '^FRONTEND_HOST=' .env; then sed -i "s|^FRONTEND_HOST=.*|FRONTEND_HOST=https://staging.api.barrels.gd|" .env; else echo "FRONTEND_HOST=https://staging.api.barrels.gd" >> .env; fi
          # Compose project name (resource namespace)
          if grep -q '^PROJECT_NAME=' .env; then sed -i "s/^PROJECT_NAME=.*/PROJECT_NAME=barrels-api-staging/" .env; else echo "PROJECT_NAME=barrels-api-staging" >> .env; fi
          # Distinct logical DB name for staging
          if grep -q '^POSTGRES_DB=' .env; then sed -i "s/^POSTGRES_DB=.*/POSTGRES_DB=app_staging/" .env; else echo "POSTGRES_DB=app_staging" >> .env; fi
          # Expose PROJECT_NAME to subsequent steps
          echo "PROJECT_NAME=$(grep '^PROJECT_NAME=' .env | cut -d'=' -f2)" >> $GITHUB_ENV
          
      - name: Build with Docker Compose
        run: docker compose -f docker-compose.yml -p "${{ env.PROJECT_NAME }}" build
          
      - name: Deploy with Docker Compose
        run: docker compose -f docker-compose.yml -p "${{ env.PROJECT_NAME }}" up -d
