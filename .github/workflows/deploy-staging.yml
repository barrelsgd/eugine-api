name: Deploy to Staging

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    if: github.repository_owner != 'fastapi'
    runs-on: [ self-hosted, staging ]

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Copy .env.example -> .env
      - name: Copy env file
        run: cp .env.example .env

      # 3. Export the variables so $STACK_NAME, $DOMAIN … exist
      - name: Export .env
        shell: bash
        run: |
          set -a          # auto‑export all vars
          source .env
          set +a
          echo "Loaded STACK_NAME=$STACK_NAME  DOMAIN=$DOMAIN"

      # 4. Build images
      - name: Build
        run: |
          docker compose --env-file .env \
                         -f docker-compose.yml \
                         --project-name "$STACK_NAME" \
                         build

      # 5. Start / update stack
      - name: Compose up
        run: |
          docker compose --env-file .env \
                         -f docker-compose.yml \
                         --project-name "$STACK_NAME" \
                         up -d --remove-orphans
