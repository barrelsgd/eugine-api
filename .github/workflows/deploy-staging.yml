name: Deploy to Staging

on:
  push:
    branches:
      - master

jobs:
  deploy:
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - staging
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Validate environment (read-only)
        run: |
          # Require pre-provisioned .env on the VM; do not create or modify it here
          if [ ! -f .env ]; then
            echo "ERROR: .env is missing on the runner. Create it once on the VM and re-run."; exit 1;
          fi

          # Read-only validations (no sed/cp)
          grep -q '^ENVIRONMENT=staging$' .env || { echo 'ERROR: ENVIRONMENT must be staging'; exit 1; }
          grep -q '^DOMAIN=staging.api.barrels.gd$' .env || { echo 'ERROR: DOMAIN must be staging.api.barrels.gd'; exit 1; }
          grep -q '^STACK_NAME=barrels-api-staging$' .env || { echo 'ERROR: STACK_NAME must be barrels-api-staging'; exit 1; }
          grep -q '^FRONTEND_HOST=https://staging.api.barrels.gd$' .env || { echo 'ERROR: FRONTEND_HOST must be https://staging.api.barrels.gd'; exit 1; }
          grep -q '^POSTGRES_DB=app_staging$' .env || { echo 'ERROR: POSTGRES_DB must be app_staging'; exit 1; }

          # Security checks — fail if insecure defaults exist; do not auto-fix
          for v in SECRET_KEY POSTGRES_PASSWORD FIRST_SUPERUSER_PASSWORD; do
            if ! grep -q "^${v}=" .env; then echo "ERROR: ${v} missing in .env"; exit 1; fi
            if grep -q "^${v}=changethis$" .env; then echo "ERROR: ${v} uses insecure default value"; exit 1; fi
          done

          # SENTRY_DSN must be empty or valid; explicitly block '1' which caused past failures
          if grep -q '^SENTRY_DSN=1$' .env; then echo 'ERROR: SENTRY_DSN must be empty or a valid DSN URL'; exit 1; fi

          # Expose PROJECT_NAME to subsequent steps (read-only)
          echo "PROJECT_NAME=$(grep '^PROJECT_NAME=' .env | cut -d'=' -f2)" >> $GITHUB_ENV
      
      - name: Build with Docker Compose
        run: docker compose -f docker-compose.yml -p "${{ env.PROJECT_NAME }}" build
          
      - name: Deploy with Docker Compose
        run: docker compose -f docker-compose.yml -p "${{ env.PROJECT_NAME }}" up -d
