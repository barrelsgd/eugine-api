name: Playwright Tests

on:
  push:
    branches:
    - master
  pull_request:
    types:
    - opened
    - synchronize
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

jobs:
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@v4
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - .env
            - docker-compose*.yml
            - .github/workflows/playwright.yml

  test-playwright:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - name: Prepare .env for CI (before any Python imports)
      run: |
        cp .env.example .env
        sed -i 's/^ENVIRONMENT=.*/ENVIRONMENT=local/' .env
        # Ensure required placeholders exist
        grep -q '^SECRET_KEY=' .env || echo 'SECRET_KEY=changethis' >> .env
        grep -q '^POSTGRES_PASSWORD=' .env || echo 'POSTGRES_PASSWORD=changethis' >> .env
        grep -q '^PROJECT_NAME=' .env || echo 'PROJECT_NAME=playwright' >> .env
        grep -q '^POSTGRES_SERVER=' .env || echo 'POSTGRES_SERVER=db' >> .env
        grep -q '^POSTGRES_USER=' .env || echo 'POSTGRES_USER=postgres' >> .env
        grep -q '^FIRST_SUPERUSER=' .env || echo 'FIRST_SUPERUSER=admin@example.com' >> .env
        grep -q '^FIRST_SUPERUSER_PASSWORD=' .env || echo 'FIRST_SUPERUSER_PASSWORD=changethis' >> .env
        # SENTRY_DSN must be empty or a valid URL
        if grep -q '^SENTRY_DSN=' .env; then sed -i 's/^SENTRY_DSN=.*/SENTRY_DSN=/' .env; else echo 'SENTRY_DSN=' >> .env; fi
        # Also place a copy where Settings(env_file="../.env") will find it when CWD=backend
        mkdir -p backend
        cp .env backend/.env
        # Export COMPOSE_PROJECT_NAME for docker compose resource namespacing
        echo "COMPOSE_PROJECT_NAME=$(grep '^PROJECT_NAME=' .env | head -n1 | cut -d= -f2- | tr -d '"')" >> $GITHUB_ENV
    - name: Create traefik network (CI)
      run: docker network create traefik-public || true
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
      with:
        limit-access-to-actor: true
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.4.15"
        enable-cache: true
    - run: uv sync
      working-directory: backend
    - run: npm ci
      working-directory: frontend
    - run: uv run bash scripts/generate-client.sh
      env:
        VIRTUAL_ENV: backend/.venv
    - run: docker compose build
    - run: docker compose down -v --remove-orphans
    - name: Start services for tests
      run: docker compose up -d db mailcatcher backend
    - name: Wait for DB healthy
      run: |
        for i in {1..30}; do
          if docker compose ps db --status running | grep -q "healthy"; then
            echo "DB is healthy"; exit 0
          fi
          echo "Waiting for DB to be healthy... ($i)"; sleep 2
        done
        echo "DB not healthy"; docker compose logs db; exit 1
    - name: Wait for backend to be healthy
      run: |
        for i in {1..30}; do
          if docker compose ps backend --status running | grep -q "healthy"; then
            echo "Backend is healthy"; exit 0
          fi
          echo "Waiting for backend to be healthy... ($i)"; sleep 2
        done
        echo "Backend not healthy"; docker compose logs backend; exit 1
    - name: Wait for MailCatcher API
      run: |
        for i in {1..30}; do
          if curl -sf http://localhost:1080/messages >/dev/null; then
            echo "MailCatcher API is up."; exit 0
          fi
          echo "Waiting for MailCatcher... ($i)"; sleep 2
        done
        echo "MailCatcher not responding"; docker compose logs mailcatcher; exit 1
    - name: Connectivity check from Playwright container
      run: |
        set -eux
        docker compose run --rm playwright sh -lc '
          echo "[playwright] DNS check:" && getent hosts mailcatcher || true;
          echo "[playwright] HTTP check mailcatcher:" && curl -sSf http://mailcatcher:1080/messages >/dev/null && echo OK;
          echo "[playwright] HTTP check backend:" && curl -sSf http://backend:8000/api/v1/utils/health-check/ >/dev/null && echo OK;
          echo "[playwright] Done."
        '
    - name: Purge MailCatcher mailbox
      run: |
        curl -s -X DELETE http://localhost:1080/messages || true
    - name: Verify MailCatcher mailbox is empty
      run: |
        echo "Message count after purge:" $(curl -s http://localhost:1080/messages | jq 'length') || true
    - name: Run Playwright tests
      run: docker compose run --rm -e MAILCATCHER_TIMEOUT_MS=60000 -e MAILCATCHER_HOST=http://mailcatcher:1080 playwright npx playwright test --fail-on-flaky-tests --trace=retain-on-failure --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    - name: Show logs on failure
      if: failure()
      run: |
        docker compose ps
        docker compose logs --no-color db || true
        docker compose logs --no-color prestart || true
        docker compose logs --no-color backend || true
        docker compose logs --no-color mailcatcher || true
        echo "Backend email debug logs (last 50 lines):"
        docker compose logs --no-color backend | grep -i "EMAIL_DEBUG" | tail -50 || true
        echo "MailCatcher messages (on failure):"
        curl -s http://localhost:1080/messages | jq -r '.[] | {id, recipients, subject, created_at} | @json' || true
        echo "MailCatcher messages from inside Playwright (on failure):"
        docker compose run --rm playwright sh -lc '
          echo "MAILCATCHER_HOST=$MAILCATCHER_HOST";
          curl -s http://mailcatcher:1080/messages | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).length)}catch(e){console.log('parse_error')}})" || true;
        '
    - run: docker compose down -v --remove-orphans
    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: frontend/blob-report
        include-hidden-files: true
        retention-days: 1

  merge-playwright-reports:
    needs:
      - test-playwright
      - changes
    # Merge reports after playwright-tests, even if some shards have failed
    if: ${{ !cancelled() && needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
    - name: Download blob reports from GitHub Actions Artifacts
      uses: actions/download-artifact@v4
      with:
        path: frontend/all-blob-reports
        pattern: blob-report-*
        merge-multiple: true
    - name: Merge into HTML Report
      run: npx playwright merge-reports --reporter html ./all-blob-reports
      working-directory: frontend
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: frontend/playwright-report
        retention-days: 30
        include-hidden-files: true

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-playwright:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-playwright
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-playwright
