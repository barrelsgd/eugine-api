name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.4.15"
          enable-cache: true
      - name: Prepare .env for CI
        run: |
          cp .env.example .env
          sed -i 's/^ENVIRONMENT=.*/ENVIRONMENT=local/' .env
          grep -q '^SECRET_KEY=' .env || echo 'SECRET_KEY=changethis' >> .env
          grep -q '^POSTGRES_PASSWORD=' .env || echo 'POSTGRES_PASSWORD=changethis' >> .env
          if grep -q '^SENTRY_DSN=' .env; then sed -i 's/^SENTRY_DSN=.*/SENTRY_DSN=/' .env; else echo 'SENTRY_DSN=' >> .env; fi
          # The prestart runs on the host, so connect to the mapped port, not the Docker DNS name
          if grep -q '^POSTGRES_SERVER=' .env; then sed -i 's/^POSTGRES_SERVER=.*/POSTGRES_SERVER=localhost/' .env; else echo 'POSTGRES_SERVER=localhost' >> .env; fi
          if grep -q '^POSTGRES_PORT=' .env; then sed -i 's/^POSTGRES_PORT=.*/POSTGRES_PORT=5432/' .env; else echo 'POSTGRES_PORT=5432' >> .env; fi
          # Ensure commonly used defaults exist
          grep -q '^POSTGRES_USER=' .env || echo 'POSTGRES_USER=postgres' >> .env
          grep -q '^FIRST_SUPERUSER=' .env || echo 'FIRST_SUPERUSER=admin@example.com' >> .env
          grep -q '^FIRST_SUPERUSER_PASSWORD=' .env || echo 'FIRST_SUPERUSER_PASSWORD=changethis' >> .env
          # Also place a copy where Settings(env_file="../.env") or similar may look when cwd=backend
          mkdir -p backend
          cp .env backend/.env
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailcatcher
      - name: Wait for DB healthy
        run: |
          for i in {1..30}; do
            if docker compose ps db --status running | grep -q "healthy"; then
              echo "DB is healthy"; exit 0
            fi
            echo "Waiting for DB to be healthy... ($i)"; sleep 2
          done
          echo "DB not healthy"; docker compose logs db; exit 1
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
