name: Validate Workflows

on:
  push:
    branches:
      - main
      - master
      - develop
      - dispatch
    paths:
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - '.github/workflows/**'

jobs:
  validate-workflows:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Validate workflow syntax
        run: |
          echo "🔍 Validating GitHub Actions workflow syntax..."
          
          # Check if actionlint is available, install if not
          if ! command -v actionlint &> /dev/null; then
            echo "📦 Installing actionlint..."
            curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
            sudo mv actionlint /usr/local/bin/
          fi
          
          # Validate all workflow files
          echo "📋 Validating workflow files..."
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              echo "🔍 Checking $workflow..."
              if actionlint "$workflow"; then
                echo "✅ $workflow is valid"
              else
                echo "❌ $workflow has issues"
                exit 1
              fi
            fi
          done
          
          echo "✅ All workflow files are syntactically valid"
          
      - name: Check workflow best practices
        run: |
          echo "🔍 Checking workflow best practices..."
          
          # Check for required elements in each workflow
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              echo "📋 Checking best practices for $workflow..."
              
              # Check for proper error handling
              if ! grep -q "if: failure()" "$workflow" && ! grep -q "continue-on-error" "$workflow"; then
                echo "⚠️ Warning: $workflow may lack proper error handling"
              fi
              
              # Check for proper logging
              if ! grep -q "echo.*✅\|echo.*❌\|echo.*🔍\|echo.*📋" "$workflow"; then
                echo "⚠️ Warning: $workflow may lack proper logging"
              fi
              
              # Check for timeout settings
              if ! grep -q "timeout-minutes\|timeout" "$workflow"; then
                echo "ℹ️ Info: $workflow doesn't specify timeouts (may be intentional)"
              fi
              
              # Check for proper permissions
              if ! grep -q "permissions:" "$workflow"; then
                echo "ℹ️ Info: $workflow doesn't specify permissions (using defaults)"
              fi
              
              echo "✅ $workflow best practices check completed"
            fi
          done
          
          echo "✅ Workflow best practices check completed"
          
      - name: Validate workflow dependencies
        run: |
          echo "🔍 Validating workflow dependencies..."
          
          # Check that required workflows exist
          REQUIRED_WORKFLOWS=("ci.yml" "test-docker-compose.yml")
          
          for workflow in "${REQUIRED_WORKFLOWS[@]}"; do
            if [ -f ".github/workflows/$workflow" ]; then
              echo "✅ Required workflow $workflow exists"
            else
              echo "❌ Required workflow $workflow is missing"
              exit 1
            fi
          done
          
          # Check that deployment workflows reference correct required checks
          for workflow in .github/workflows/deploy-*.yml; do
            if [ -f "$workflow" ]; then
              echo "📋 Checking deployment workflow: $workflow"
              if grep -q "Test Docker Compose" "$workflow"; then
                echo "✅ $workflow references 'Test Docker Compose' check"
              else
                echo "⚠️ Warning: $workflow may not reference 'Test Docker Compose' check"
              fi
            fi
          done
          
          echo "✅ Workflow dependencies validation completed"
          
      - name: Check for security issues
        run: |
          echo "🔍 Checking for security issues in workflows..."
          
          # Check for hardcoded secrets or sensitive data
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              echo "📋 Checking security for $workflow..."
              
              # Check for potential hardcoded secrets
              if grep -q -E "(password|secret|key|token).*=.*['\"][^'\"]{8,}" "$workflow"; then
                echo "⚠️ Warning: $workflow may contain hardcoded secrets"
              fi
              
              # Check for proper secret usage
              if grep -q -E "\${{.*secrets\." "$workflow"; then
                echo "✅ $workflow uses secrets properly"
              fi
              
              # Check for dangerous permissions
              if grep -q "permissions:" "$workflow"; then
                if grep -q "contents: write" "$workflow"; then
                  echo "⚠️ Warning: $workflow has write permissions to contents"
                fi
              fi
              
              echo "✅ $workflow security check completed"
            fi
          done
          
          echo "✅ Security check completed"
          
      - name: Generate workflow report
        run: |
          echo "📊 Generating workflow validation report..."
          
          echo "# Workflow Validation Report" > workflow-report.md
          echo "" >> workflow-report.md
          echo "## Summary" >> workflow-report.md
          echo "- Total workflows: $(ls .github/workflows/*.yml | wc -l)" >> workflow-report.md
          echo "- Validation date: $(date)" >> workflow-report.md
          echo "" >> workflow-report.md
          
          echo "## Workflow Files" >> workflow-report.md
          for workflow in .github/workflows/*.yml; do
            if [ -f "$workflow" ]; then
              echo "- $(basename "$workflow")" >> workflow-report.md
            fi
          done
          
          echo "" >> workflow-report.md
          echo "## Validation Results" >> workflow-report.md
          echo "✅ All workflow files passed validation" >> workflow-report.md
          
          echo "📋 Workflow validation report generated:"
          cat workflow-report.md
          
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: workflow-validation-report
          path: workflow-report.md
          retention-days: 30
