services:

  db:
    image: postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME:-fast-back}-adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.${STACK_NAME:-fast-back}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME:-fast-back}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME:-fast-back}-adminer-http.service=${STACK_NAME:-fast-back}-adminer
      - traefik.http.routers.${STACK_NAME:-fast-back}-adminer-https.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.${STACK_NAME:-fast-back}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME:-fast-back}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME:-fast-back}-adminer-https.service=${STACK_NAME:-fast-back}-adminer
      - traefik.http.services.${STACK_NAME:-fast-back}-adminer.loadbalancer.server.port=8080

  prestart:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/prestart.sh
    volumes:
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./email-templates:/app/email-templates
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./alembic
          target: /app/alembic
        - action: sync
          path: ./email-templates
          target: /app/email-templates
        - action: sync
          path: ./scripts
          target: /app/scripts
        - action: sync
          path: ./alembic.ini
          target: /app/alembic.ini
        - action: sync
          path: ./pyproject.toml
          target: /app/pyproject.toml

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request,socket; socket.setdefaulttimeout(3);\n\ntry:\n    r=urllib.request.urlopen('http://localhost:8000/api/v1/utils/health-check/'); sys.exit(0 if r.status==200 else 1)\nexcept Exception:\n    sys.exit(1)"
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME:-fast-back}-api.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME:-fast-back}-api-http.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`))
      - traefik.http.routers.${STACK_NAME:-fast-back}-api-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME:-fast-back}-api-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME:-fast-back}-api-http.service=${STACK_NAME:-fast-back}-api

      - traefik.http.routers.${STACK_NAME:-fast-back}-api-https.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`))
      - traefik.http.routers.${STACK_NAME:-fast-back}-api-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME:-fast-back}-api-https.tls=true
      - traefik.http.routers.${STACK_NAME:-fast-back}-api-https.priority=100
      - traefik.http.routers.${STACK_NAME:-fast-back}-api-https.service=${STACK_NAME:-fast-back}-api

volumes:
  app-db-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
